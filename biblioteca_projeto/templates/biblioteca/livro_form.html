{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">📚 Cadastrar Novo Livro</h3>
                
                <!-- O enctype é obrigatório caso o seu modelo de livro envie imagens/capas -->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <!-- Renderiza todos os campos do modelo de forma organizada -->
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text">{{ field.help_text }}</div>
                            {% endif %}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'livro_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Salvar Livro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Scripts rápidos para deixar os inputs com a cara do Bootstrap automaticamente -->
<script>
    document.querySelectorAll('input, textarea, select').forEach(function(el) {
        if (el.type !== 'checkbox' && el.type !== 'file') {
            el.classList.add('form-control');
        }
    });
</script>
{% endblock %}
